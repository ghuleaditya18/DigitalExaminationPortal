{% extends 'base.html' %}
{% block content %}
<div class="form-card">
    <h1>Reset Password</h1>
    <p>Create a new secure password for your account.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset Password</button>
    </form>
</div>
{% endblock %}
