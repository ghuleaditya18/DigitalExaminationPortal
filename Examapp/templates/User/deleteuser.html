{% extends 'base.html' %}
{% block content %}

<div class="form-card">
    <h1>Delete User</h1>
    <p>Are you sure you want to delete this user?</p>
    <div class="confirmation-box">{{ user.username }}</div>
    <form method="POST" action="{% url 'delete_user' user.id %}">
        {% csrf_token %}
        <button type="submit" class="danger-button">Delete User</button>
        <a href="{% url 'show_all_user' %}" class="button-link secondary-link">Cancel</a>
    </form>
</div>

{% endblock %}
