{% extends 'base.html' %}
{% block content %}
<div class="auth-shell">
    <div class="auth-heading">
        <h1>Digital Examination Portal</h1>
        <p>Select your account type to continue.</p>
    </div>
    <div class="role-grid">
        <a href="{% url 'student_login' %}" class="role-card">
            <i class="bi bi-mortarboard"></i>
            <h2>Student Login</h2>
            <p>Start tests, view exam details and manage your profile.</p>
        </a>
        <a href="{% url 'teacher_login' %}" class="role-card">
            <i class="bi bi-person-workspace"></i>
            <h2>Teacher Login</h2>
            <p>Manage questions, users and student test results.</p>
        </a>
    </div>
</div>
{% endblock %}
