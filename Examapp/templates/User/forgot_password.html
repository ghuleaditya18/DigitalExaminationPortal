{% extends 'base.html' %}
{% block content %}
<div class="form-card">
    <h1>Forgot Password</h1>
    <p>Confirm your {{ role }} username and registered mobile number.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset OTP</button>
    </form>
</div>
{% endblock %}
