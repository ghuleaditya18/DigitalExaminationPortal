{% extends 'base.html' %}
{% block content %}

<div class="form-card">

    <h1>Update Subject</h1>

    <form
        method="POST"
        action="{% url 'update_subject' subject.subject_id %}"
    >

        {% csrf_token %}

        <label>Subject Name</label>

        <input
            type="text"
            name="subject_name"
            value="{{ subject.subject_name }}"
            required
        >

        <button type="submit">
            Update Subject
        </button>

    </form>

</div>

{% endblock %}
