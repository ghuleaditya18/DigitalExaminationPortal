{% extends 'base.html' %}
{% block content %}

<div class="form-card">

    <h1>Create Subject</h1>
    <p>Add a new subject.</p>

    <form method="POST">

        {% csrf_token %}

        <label>Subject Name</label>

        <input
            type="text"
            name="subject_name"
            required
        >

        <button type="submit">
            Save Subject
        </button>

    </form>

</div>

{% endblock %}
