{% extends 'base.html' %}
{% block content %}

<div class="form-card">

    <h1>Delete Subject</h1>

    <div class="delete-warning">
        Are you sure you want to delete
        <strong>{{ subject.subject_name }}</strong> ?
    </div>
    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="danger-button"
        >
            Delete Subject
        </button>

    </form>

</div>

{% endblock %}
